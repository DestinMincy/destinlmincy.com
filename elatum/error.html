<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELATUM — Something went wrong</title>
  <link rel="icon" href="elatum-logo-5.0__favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #02060a;
      --bg-card:  #0a1929;
      --cyan:     #00f2fe;
      --purple:   #8e2de2;
      --purple-2: #a855f7;
      --border:   rgba(0, 242, 254, 0.1);
      --text:     #f0f6ff;
      --muted:    rgba(240, 246, 255, 0.5);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 40% at 50% 0%, rgba(142,45,226,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 50% 30% at 80% 100%, rgba(0,242,254,0.05) 0%, transparent 60%);
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .logo {
      margin-bottom: 36px;
    }

    .logo img {
      height: 28px;
      display: block;
      margin: 0 auto;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(142, 45, 226, 0.12);
      border: 1px solid rgba(142, 45, 226, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 1.5rem;
      color: var(--purple-2);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      color: #fff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 11px 24px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: rgba(0,242,254,0.3);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .contact-line {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .contact-line a {
      color: var(--cyan);
      text-decoration: none;
    }

    .contact-line a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="logo">
    <img src="elatum-logo-5.0__lockup.svg" alt="ELATUM" />
  </div>

  <div class="icon-wrap">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>

  <h1>We hit a snag on our end.</h1>

  <p>
    Something went wrong loading this page — likely a temporary hiccup on our end,
    not yours. Give it a moment and try again. If it keeps happening,
    reach out directly.
  </p>

  <div class="actions">
    <button class="btn-primary" onclick="window.location.reload()">
      <i class="fa-solid fa-arrows-rotate"></i> Try again
    </button>
    <a href="/" class="btn-ghost">
      <i class="fa-solid fa-arrow-left"></i> Back to home
    </a>
  </div>

  <hr class="divider" />

  <div class="contact-line">
    Still stuck? &nbsp;<a href="mailto:dlmincy@destinlmincy.com">dlmincy@destinlmincy.com</a>
  </div>

</div>

</body>
</html>
